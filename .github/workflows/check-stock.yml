name: Check carrot juice stock

on:
  schedule:
    # Every 3 hours, at :17 past (GitHub delays runs at the top of the hour).
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check stock
        id: check
        run: python -m tracker
        continue-on-error: true

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data tracker/walmart_ops.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Stock check $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --quiet
            git push
          fi

      - name: Fail if every store failed
        if: steps.check.outcome == 'failure'
        run: exit 1
